<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Codex Speed · 动态仪表</title>
  <style>
    @property --fill {
      syntax: "<angle>";
      inherits: true;
      initial-value: 0turn;
    }
    :root {
      color-scheme: dark;
      background: #080b10;
      color: #eef8f6;
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      font-synthesis: none;
      --muted: #9db1b6;
      --rule: #263b41;
      --mint: #79ffdc;
      --mono: ui-monospace, "SF Mono", Menlo, monospace;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      background: radial-gradient(ellipse 72% 60% at 24% 0%, #122b2c 0%, transparent 72%);
    }
    [hidden] { display: none !important; }
    button, input { font: inherit; }
    button { color: inherit; cursor: pointer; }
    :focus-visible { outline: 2px solid #6cf3d4; outline-offset: 3px; }

    main {
      width: min(1120px, calc(100% - 64px));
      margin: 0 auto;
      padding: clamp(32px, 7.5vw, 92px) 0 70px;
    }
    .intro { display: grid; gap: 8px; justify-items: start; }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--mint);
      font: 650 12px/1.3 var(--mono);
      letter-spacing: .09em;
    }
    .brand-mark {
      width: 15px;
      height: 15px;
      border: 1.5px solid #4a7872;
      border-top-color: var(--mint);
      border-right-color: var(--mint);
      border-radius: 50%;
      transform: rotate(-20deg);
      box-shadow: 0 0 12px #69ffe14d;
    }
    h1 {
      margin: 2px 0 0;
      color: #f4fffc;
      font-size: clamp(42px, 6.6vw, 78px);
      font-weight: 750;
      line-height: 1.08;
      letter-spacing: -.055em;
    }
    .intro p { margin: 0; color: var(--muted); font-size: 14px; }
    .workbench {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 294px;
      margin-top: 32px;
      border: 1px solid #31474d;
      border-radius: 18px;
      background: #10181c;
      box-shadow: 0 28px 82px #050708bf;
    }

    .stage {
      --face-top: #202e37;
      --face-bottom: #080c11;
      --orb-text: #eafff7;
      --orb-muted: #a7bbc1;
      --track: #29414a;
      --edge: #526970;
      --ink-current: #79ffdc;
      --low-current: #118078;
      --high-current: #5bffd4;
      --ink-pinned: #ffce86;
      --low-pinned: #a15e18;
      --high-pinned: #ffc36e;
      --ink-recent: #b4cbd7;
      --low-recent: #4e7083;
      --high-recent: #a4c6db;
      --stage-ink: #d9e9e7;
      --stage-muted: #9db1b6;
      --stage-rule: #24393d;
      --stage-surface: #0e171b;
      --stage-panel: #192529;
      --canvas-fill: #090f14;
      --canvas-light: #182f32;
      --grid: #7db5b51e;
      --reticle-line: #5d8d8a52;
      --menu-shadow: #05080bb5;
      --beam-glow: .9;
      color-scheme: dark;
      min-width: 0;
      display: grid;
      grid-template-rows: auto minmax(350px, 1fr) auto;
      border-radius: 17px 0 0 17px;
      color: var(--stage-ink);
      background: var(--stage-surface);
    }
    .stage[data-theme="light"] {
      --face-top: #fafdfd;
      --face-bottom: #cfdee2;
      --orb-text: #10252d;
      --orb-muted: #3c565f;
      --track: #b0c6cb;
      --edge: #718f96;
      --ink-current: #075c4a;
      --low-current: #16665e;
      --high-current: #0fb88b;
      --ink-pinned: #754a10;
      --low-pinned: #8d5418;
      --high-pinned: #efaa39;
      --ink-recent: #375666;
      --low-recent: #436777;
      --high-recent: #6e9fb5;
      --stage-ink: #153339;
      --stage-muted: #3d5960;
      --stage-rule: #c2d4d6;
      --stage-surface: #eaf3f4;
      --stage-panel: #fbfdfd;
      --canvas-fill: #e2edef;
      --canvas-light: #c4dddf;
      --grid: #3a697225;
      --reticle-line: #577c8566;
      --menu-shadow: #263b4540;
      --beam-glow: .34;
      color-scheme: light;
    }
    .stage-header, .stage-footer {
      display: flex;
      min-width: 0;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 17px;
    }
    .stage-header { border-bottom: 1px solid var(--stage-rule); }
    .stage-footer { border-top: 1px solid var(--stage-rule); }
    .stage-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 670;
    }
    .stage-label::before {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--ink-current);
      box-shadow: 0 0 9px var(--high-current);
      content: "";
    }
    .stage-footer p { margin: 0; color: var(--stage-muted); font-size: 11px; }
    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .choices {
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 2px;
      border: 1px solid var(--stage-rule);
      border-radius: 6px;
    }
    .choices button {
      min-width: 40px;
      min-height: 26px;
      padding: 3px 8px;
      border: 0;
      border-radius: 4px;
      color: var(--stage-muted);
      background: transparent;
      font-size: 11px;
      font-weight: 560;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .choices button:hover { color: var(--stage-ink); }
    .choices button[aria-pressed="true"] {
      color: var(--ink-current);
      background: var(--stage-panel);
      box-shadow: inset 0 0 0 1px var(--stage-rule);
      font-weight: 680;
    }
    .canvas {
      position: relative;
      z-index: 1;
      display: grid;
      place-items: center;
      isolation: isolate;
      background: radial-gradient(ellipse at 50% 48%, var(--canvas-light), var(--canvas-fill) 66%);
    }
    .canvas::before {
      position: absolute;
      z-index: -1;
      inset: 0;
      background:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-position: center;
      background-size: 27px 27px;
      mask-image: radial-gradient(ellipse 65% 80%, #000 15%, transparent 88%);
      content: "";
      pointer-events: none;
    }
    .reticle {
      position: absolute;
      z-index: -1;
      width: min(277px, 91%);
      aspect-ratio: 1;
      border: 1px solid var(--reticle-line);
      border-radius: 50%;
      background:
        linear-gradient(var(--reticle-line) 1px, transparent 1px) center / 100% 1px no-repeat,
        linear-gradient(90deg, var(--reticle-line) 1px, transparent 1px) center / 1px 100% no-repeat;
      opacity: .73;
      pointer-events: none;
    }
    .reticle::after {
      position: absolute;
      inset: 15px;
      border: 1px dashed var(--reticle-line);
      border-radius: 50%;
      content: "";
    }
    .orb-space {
      --zoom: 1.517241;
      position: relative;
      width: 176px;
      height: 176px;
    }
    .orb {
      --ink: var(--ink-current);
      --low: var(--low-current);
      --high: var(--high-current);
      position: absolute;
      top: 50%;
      left: 50%;
      width: 116px;
      height: 116px;
      transform: translate(-50%, -50%) scale(var(--zoom));
      isolation: isolate;
      border-radius: 50%;
      color: var(--orb-text);
      background-clip: padding-box;
      box-shadow: 0 17px 38px var(--menu-shadow), 0 0 0 1px var(--stage-rule);
      text-align: center;
      transition: --fill 360ms cubic-bezier(.16, .64, .24, 1);
    }
    .orb[data-source="pinned"] {
      --ink: var(--ink-pinned);
      --low: var(--low-pinned);
      --high: var(--high-pinned);
    }
    .orb[data-source="recent"] {
      --ink: var(--ink-recent);
      --low: var(--low-recent);
      --high: var(--high-recent);
    }
    .orb.snap, .orb[data-style="minimal"] { transition: none; }
    .face, .ticks, .track, .beam, .beam span, .arc-head, .orbit, .orbit span, .focus-flash {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }
    .face {
      inset: .8px;
      border: .72px solid color-mix(in srgb, var(--edge) 64%, transparent);
      background:
        radial-gradient(ellipse at 24% 24%, color-mix(in srgb, var(--low) 35%, transparent), transparent 66%),
        linear-gradient(155deg, var(--face-top), var(--face-bottom) 76%);
    }
    .ticks { inset: 0; opacity: .75; }
    .ticks::before,
    .ticks::after {
      position: absolute;
      inset: 0;
      content: "";
    }
    .ticks::before {
      background: repeating-conic-gradient(from -.48deg, var(--edge) 0 .86deg, transparent .86deg 7.5deg);
      mask-image: radial-gradient(circle, transparent 52.05px, #000 52.48px 53.65px, transparent 54px);
    }
    .ticks::after {
      background: repeating-conic-gradient(from -.48deg, var(--edge) 0 .95deg, transparent .95deg 30deg);
      mask-image: radial-gradient(circle, transparent 50.5px, #000 50.9px 53.65px, transparent 54px);
    }
    .track { inset: 7.9px; border: 2.8px solid var(--track); }
    .beam { inset: 0; filter: drop-shadow(0 0 2px color-mix(in srgb, var(--high) 79%, transparent)); }
    .beam span {
      inset: 0;
      background: conic-gradient(var(--low) 0turn, var(--high) var(--fill), transparent var(--fill));
      mask-image: radial-gradient(circle, transparent 46.65px, #000 47px 50.35px, transparent 50.75px);
    }
    .arc-head, .orbit { inset: 0; }
    .arc-head { transform: rotate(var(--fill)); }
    .arc-head::after, .orbit::after {
      position: absolute;
      left: 50%;
      width: 3.9px;
      height: 3.9px;
      border-radius: 50%;
      background: var(--orb-text);
      box-shadow: 0 0 5px var(--high);
      content: "";
    }
    .arc-head::after { top: 9.3px; transform: translate(-50%, -50%); }
    .orbit { display: none; }
    .orbit span {
      inset: 0;
      background: conic-gradient(transparent 0turn .87turn, color-mix(in srgb, var(--high) 10%, transparent) .89turn, var(--high) 1turn);
      mask-image: radial-gradient(circle, transparent 53.9px, #000 54.15px 55.15px, transparent 55.45px);
    }
    .orbit::after {
      top: 3.3px;
      width: 2.5px;
      height: 2.5px;
      transform: translate(-50%, -50%);
      background: var(--high);
    }
    .orb[data-state="measured"] .orbit, .orb[data-state="waiting"] .orbit {
      display: block;
      animation: turn 3.2s linear infinite;
    }
    .orb:not([data-state="measured"]) .beam, .orb:not([data-state="measured"]) .arc-head { visibility: hidden; }
    @keyframes turn { to { transform: rotate(1turn); } }
    .focus-flash { inset: 13px; opacity: 0; border: 1.1px solid var(--high); }
    .orb[data-style="minimal"] .ticks,
    .orb[data-style="minimal"] .arc-head,
    .orb[data-style="minimal"] .orbit,
    .orb[data-style="minimal"] .meter-signal,
    .orb[data-style="minimal"] .focus-flash { display: none; }
    .orb[data-style="minimal"] .face { background: linear-gradient(155deg, var(--face-top), var(--face-bottom) 76%); }
    .orb[data-style="minimal"] .track { inset: 8.3px; border-width: 2px; }
    .orb[data-style="minimal"] .beam { filter: none; }
    .orb[data-style="minimal"] .beam span {
      mask-image: radial-gradient(circle, transparent 47.3px, #000 47.5px 49.9px, transparent 50.15px);
    }
    .orb-content { position: relative; }
    .orb-source, .orb-name, .orb-number, .orb-unit, .orb-status, .meter-signal {
      position: absolute;
      left: 50%;
      transform: translate(-50%, -50%);
      white-space: nowrap;
    }
    .orb-source {
      top: 20px;
      display: flex;
      align-items: center;
      gap: 3.6px;
      color: var(--ink);
      font-size: 8.6px;
      font-weight: 550;
      line-height: 1.1;
    }
    .orb-source::before {
      width: 2.8px;
      height: 2.8px;
      border-radius: 50%;
      background: var(--ink);
      content: "";
    }
    .orb-name {
      top: 34.5px;
      width: 77px;
      overflow: hidden;
      font-size: 11.2px;
      font-weight: 630;
      line-height: 1.15;
      text-overflow: ellipsis;
    }
    .orb-number {
      top: 59.5px;
      font: 650 30px/1 -apple-system, BlinkMacSystemFont, sans-serif;
      letter-spacing: -.025em;
      text-shadow: 0 0 5px color-mix(in srgb, var(--high) calc(var(--beam-glow) * 38%), transparent);
      font-variant-numeric: tabular-nums;
    }
    .orb-unit, .orb-status { top: 80.5px; color: var(--orb-muted); }
    .orb-unit { font: 400 8.4px/1 var(--mono); }
    .orb-status { font-size: 11px; font-weight: 570; line-height: 1; }
    .orb[data-style="minimal"] .orb-status { top: 61px; font-size: 15px; }
    .orb[data-style="minimal"] .orb-number { text-shadow: none; }
    .meter-signal {
      top: 59px;
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      color: var(--ink);
    }
    .orb-breathe {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 8px var(--high);
      animation: breathe 2.6s ease-in-out infinite;
    }
    .orb-bars { display: flex; gap: 2.9px; align-items: center; }
    .orb-bars::before {
      position: absolute;
      inset: 0;
      border: .8px solid var(--high);
      border-radius: 50%;
      opacity: 0;
      animation: ripple 1.34s ease-out infinite;
      content: "";
    }
    .orb-bars i {
      width: 2.2px;
      height: var(--height);
      border-radius: 1.1px;
      background: currentColor;
      animation: pulse 1.34s ease-in-out infinite;
      animation-delay: var(--delay);
    }
    @keyframes breathe { 0%, 100% { opacity: .32; } 50% { opacity: .94; } }
    @keyframes pulse { 0%, 100% { transform: scaleY(.44); } 50% { transform: scaleY(1.12); } }
    @keyframes ripple {
      0% { opacity: 0; transform: scale(.72); }
      22% { opacity: .65; }
      100% { opacity: 0; transform: scale(1.27); }
    }
    @media (prefers-reduced-motion: reduce) {
      .orb { transition: none; }
      .orb[data-state] .orbit, .orb .focus-flash { display: none; }
      .orb-breathe, .orb-bars i, .orb-bars::before { animation: none; }
    }

    .parallel {
      position: absolute;
      left: 35px;
      top: 88px;
      width: 46px;
      height: 15px;
      padding: 0;
      border: .65px solid color-mix(in srgb, var(--edge) 52%, transparent);
      border-radius: 20px;
      color: var(--orb-text);
      background: color-mix(in srgb, var(--track) 58%, transparent);
      font-size: 9px;
      font-weight: 650;
    }
    .parallel:hover { border-color: var(--ink); color: var(--ink); }
    .session-menu {
      position: absolute;
      z-index: 3;
      top: calc(100% + 8px);
      left: 50%;
      width: min(277px, calc(100vw - 58px));
      transform: translateX(-50%);
      padding: 5px;
      border: 1px solid var(--stage-rule);
      border-radius: 10px;
      color: var(--stage-ink);
      background: var(--stage-panel);
      box-shadow: 0 11px 28px var(--menu-shadow);
    }
    .session-menu button {
      display: flex;
      width: 100%;
      min-height: 34px;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 4px 8px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      text-align: left;
      font-size: 12px;
    }
    .session-menu button:hover, .session-menu button:focus-visible {
      color: var(--ink-current);
      background: var(--stage-surface);
    }
    .session-menu button[aria-current="true"] { font-weight: 680; }
    .session-menu button span:last-child {
      color: var(--stage-muted);
      font: 500 9.5px/1.35 var(--mono);
      white-space: nowrap;
    }
    .session-menu hr { margin: 4px 3px; border: 0; border-top: 1px solid var(--stage-rule); }

    .sessions {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 20px 16px 16px;
      border-left: 1px solid var(--rule);
    }
    .sessions h2 {
      margin: 0 10px 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 620;
    }
    .sessions button {
      width: 100%;
      min-height: 54px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 10px;
      border: 1px solid transparent;
      border-radius: 8px;
      text-align: left;
      background: transparent;
    }
    .sessions button:hover { background: #192529; }
    .sessions button[aria-pressed="true"] {
      border-color: #35625c;
      color: var(--mint);
      background: #17312f;
    }
    .session-icon {
      width: 8px;
      height: 8px;
      flex: 0 0 8px;
      border: 1px solid #759498;
      border-radius: 50%;
    }
    [aria-pressed="true"] .session-icon {
      border-color: #9cffe5;
      background: var(--mint);
      box-shadow: 0 0 8px #70ffdc80;
    }
    .session-name { display: block; font-size: 13px; font-weight: 670; }
    .session-reading { display: block; color: var(--muted); font: 500 10px/1.65 var(--mono); }
    .sessions .unidentified {
      min-height: 38px;
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
    }
    .rate-control {
      margin-top: auto;
      padding: 13px 10px 4px;
      border-top: 1px solid var(--rule);
    }
    .rate-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
    .rate-heading label { color: var(--muted); font-size: 12px; }
    .rate-heading output { color: var(--mint); font: 600 11px/1.4 var(--mono); white-space: nowrap; }
    .rate-control input { width: 100%; margin: 10px 0 3px; accent-color: var(--mint); cursor: ew-resize; }
    .rate-control input:disabled { opacity: .47; cursor: default; }

    @media (max-width: 780px) {
      main { width: calc(100% - 36px); padding-bottom: 46px; }
      .workbench { grid-template-columns: minmax(0, 1fr); margin-top: 23px; }
      .stage { grid-template-rows: auto minmax(289px, 1fr) auto; border-radius: 17px 17px 0 0; }
      .sessions { border-top: 1px solid var(--rule); border-left: 0; }
      #session-switches { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 460px) {
      .stage-header, .stage-footer { gap: 8px; padding: 9px 11px; }
      .choices button { min-width: 44px; min-height: 44px; }
      .session-menu button { min-height: 44px; }
      .sessions .unidentified, .rate-control input { min-height: 44px; }
    }
  </style>
</head>
<body>
  <main>
    <header class="intro">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span>Codex Speed</div>
      <h1>动态仪表</h1>
      <p>拖动速率滑杆，或切换会话查看悬浮球的变化。</p>
    </header>

    <div class="workbench">
      <section class="stage" id="stage" data-theme="dark" aria-label="悬浮球预览">
        <div class="stage-header">
          <span class="stage-label">悬浮球预览</span>
          <div class="choices" role="group" aria-label="配色">
            <button type="button" data-theme="dark" aria-pressed="true">深色</button>
            <button type="button" data-theme="light" aria-pressed="false">浅色</button>
          </div>
        </div>

        <div class="canvas">
          <div class="reticle" aria-hidden="true"></div>
          <div class="orb-space" id="orb-space">
            <div class="orb" id="orb" data-style="instrument" tabindex="0" aria-label="悬浮球，右键或按菜单键查看会话">
              <span class="face" aria-hidden="true"></span>
              <span class="ticks" aria-hidden="true"></span>
              <span class="track" aria-hidden="true"></span>
              <span class="beam" aria-hidden="true"><span></span></span>
              <span class="arc-head" aria-hidden="true"></span>
              <span class="orbit" id="orbit" aria-hidden="true"><span></span></span>
              <span class="focus-flash" id="focus-flash" aria-hidden="true"></span>
              <div class="orb-content" aria-live="polite">
                <span class="orb-source" id="orb-source"></span>
                <span class="orb-name" id="orb-name"></span>
                <span class="orb-number" id="orb-number"></span>
                <span class="orb-unit" id="orb-unit"></span>
                <span class="meter-signal" id="meter-signal" aria-hidden="true">
                  <span class="orb-breathe" id="standby-light"></span>
                  <span class="orb-bars" id="waiting-wave">
                    <i style="--height:4px;--delay:0ms"></i>
                    <i style="--height:9px;--delay:-190ms"></i>
                    <i style="--height:16px;--delay:-380ms"></i>
                    <i style="--height:9px;--delay:-570ms"></i>
                    <i style="--height:4px;--delay:-760ms"></i>
                  </span>
                </span>
                <span class="orb-status" id="orb-status"></span>
              </div>
              <button class="parallel" id="parallel" type="button" aria-expanded="false" aria-controls="session-menu"></button>
            </div>
            <div class="session-menu" id="session-menu" aria-label="会话列表" hidden></div>
          </div>
        </div>

        <div class="stage-footer">
          <p>点按「并行」或右键查看会话</p>
          <div class="controls">
            <div class="choices" role="group" aria-label="表盘样式">
              <button type="button" data-style="instrument" aria-pressed="true">动态</button>
              <button type="button" data-style="minimal" aria-pressed="false">简洁</button>
            </div>
            <div class="choices" role="group" aria-label="直径">
              <button type="button" data-size="84" aria-pressed="false" aria-label="84 点">84</button>
              <button type="button" data-size="116" aria-pressed="false" aria-label="116 点">116</button>
              <button type="button" data-size="176" aria-pressed="true" aria-label="176 点">176</button>
            </div>
          </div>
        </div>
      </section>

      <aside class="sessions">
        <nav aria-label="示例会话">
          <h2>示例会话</h2>
          <div id="session-switches"></div>
          <button class="unidentified" type="button" data-session="unknown" aria-pressed="false">模拟无法识别当前会话</button>
        </nav>
        <div class="rate-control">
          <div class="rate-heading">
            <label for="rate">模拟速率</label>
            <output id="rate-label" for="rate"></output>
          </div>
          <input id="rate" type="range" min="0" max="220" step="1">
        </div>
      </aside>
    </div>
  </main>

  <script>
    const sessions = [
      { id: "orb", name: "重做悬浮球", rate: 86, state: "measured" },
      { id: "package", name: "验证安装包", rate: 42, estimated: true, state: "measured" },
      { id: "permissions", name: "修正权限提示", state: "waiting" },
      { id: "notes", name: "整理发布说明", state: "idle" },
    ];
    const active = sessions.filter(session => session.state !== "idle");
    const sourceNames = { current: "当前会话", pinned: "已固定", recent: "最近活跃" };
    const get = id => document.getElementById(id);
    const switches = get("session-switches");
    const stage = get("stage");
    const orb = get("orb");
    const menu = get("session-menu");
    const parallel = get("parallel");
    const rate = get("rate");
    const motionPreference = matchMedia("(prefers-reduced-motion: reduce)");
    let currentID = sessions[0].id;
    let pinnedID;
    let menuTrigger;
    let previousSessionID;
    let sessionFlash;

    function reading(session) {
      if (session.state === "measured") {
        return (session.estimated ? "约 " : "") + session.rate + " token / s";
      }
      return session.state === "waiting" ? "等待读数" : "待机";
    }

    function selection() {
      const focused = sessions.find(session => session.id === currentID);
      const pinned = active.find(session => session.id === pinnedID);
      return {
        focused,
        primary: pinned || focused || active[0],
        source: pinned ? "pinned" : focused ? "current" : "recent",
      };
    }

    function render() {
      const { primary, source } = selection();
      const isMeasured = primary.state === "measured";
      const canAnimate = orb.dataset.style === "instrument" && !motionPreference.matches;
      const switched = previousSessionID !== undefined && primary.id !== previousSessionID;
      const count = active.filter(session => session.id !== primary.id).length;
      const fraction = isMeasured ? Math.max(.025, primary.rate / (primary.rate + 55)) : 0;

      orb.dataset.source = source;
      orb.dataset.state = primary.state;
      if (switched && canAnimate) {
        orb.classList.add("snap");
        orb.style.setProperty("--fill", "0turn");
        getComputedStyle(orb).getPropertyValue("--fill");
        orb.classList.remove("snap");
        sessionFlash?.cancel();
        sessionFlash = get("focus-flash").animate([
          { opacity: 0, transform: "scale(.78)" },
          { opacity: .84, transform: "scale(.91)", offset: .22 },
          { opacity: 0, transform: "scale(1.15)" },
        ], { duration: 580, easing: "ease-out" });
      }
      orb.style.setProperty("--fill", fraction + "turn");
      if (canAnimate) {
        const spin = get("orbit").getAnimations()[0];
        spin?.updatePlaybackRate(primary.state === "waiting" ? .68 : .62 + fraction * 1.68);
      }
      previousSessionID = primary.id;
      orb.title = sourceNames[source] + "，" + primary.name + "，" + reading(primary);

      get("orb-source").textContent = sourceNames[source];
      get("orb-name").textContent = primary.name;
      get("orb-number").textContent = primary.rate ?? "";
      get("orb-unit").textContent = primary.estimated ? "约 token / s" : "token / s";
      get("orb-status").textContent = reading(primary);
      get("orb-number").hidden = !isMeasured;
      get("orb-unit").hidden = !isMeasured;
      get("meter-signal").hidden = isMeasured;
      get("standby-light").hidden = primary.state !== "idle";
      get("waiting-wave").hidden = primary.state !== "waiting";
      get("orb-status").hidden = isMeasured;
      parallel.textContent = "并行 " + count;
      parallel.setAttribute("aria-label", "查看 " + count + " 个并行会话");
      parallel.hidden = count === 0;

      rate.disabled = !isMeasured;
      rate.value = primary.rate ?? 0;
      get("rate-label").textContent = isMeasured ? primary.rate + " token / s" : "—";
      for (const button of document.querySelectorAll("[data-session]")) {
        button.setAttribute("aria-pressed", String(button.dataset.session === currentID));
      }
      for (const session of sessions) {
        get("reading-" + session.id).textContent = reading(session);
      }
    }

    for (const session of sessions) {
      const button = document.createElement("button");
      button.type = "button";
      button.dataset.session = session.id;
      button.innerHTML = '<span class="session-icon" aria-hidden="true"></span><span><span class="session-name"></span><span class="session-reading"></span></span>';
      button.querySelector(".session-name").textContent = session.name;
      button.querySelector(".session-reading").id = "reading-" + session.id;
      switches.append(button);
    }

    function closeMenu(restoreFocus = false) {
      menu.hidden = true;
      parallel.setAttribute("aria-expanded", "false");
      if (restoreFocus) menuTrigger?.focus({ preventScroll: true });
    }

    function menuButton(name, detail, onClick) {
      const button = document.createElement("button");
      button.type = "button";
      const label = document.createElement("span");
      const value = document.createElement("span");
      label.textContent = name;
      value.textContent = detail;
      button.append(label, value);
      button.addEventListener("click", () => {
        onClick();
        closeMenu(true);
        render();
      });
      return button;
    }

    function openMenu(trigger) {
      const { focused, primary, source } = selection();
      menu.replaceChildren();
      const entries = active.filter(session => session.id !== focused?.id);
      if (focused) entries.unshift(focused);
      for (const [index, session] of entries.entries()) {
        if (index === 1 && focused) menu.append(document.createElement("hr"));
        const role = session.id === focused?.id ? "当前会话" : session.id === primary.id ? sourceNames[source] : "";
        const name = role ? role + " · " + session.name : session.name;
        const item = menuButton(name, reading(session), () => {
          pinnedID = session.id === focused?.id ? undefined : session.id;
        });
        if (session.id === primary.id) item.setAttribute("aria-current", "true");
        menu.append(item);
      }
      if (pinnedID) {
        menu.append(document.createElement("hr"), menuButton("取消固定", "", () => { pinnedID = undefined; }));
      }
      menuTrigger = trigger;
      menu.hidden = false;
      parallel.setAttribute("aria-expanded", "true");
      menu.querySelector("button")?.focus({ preventScroll: true });
    }

    function applyChoice(selector, update) {
      const choices = document.querySelectorAll(selector);
      for (const button of choices) {
        button.addEventListener("click", () => {
          for (const choice of choices) choice.setAttribute("aria-pressed", String(choice === button));
          update(button.dataset);
        });
      }
    }

    applyChoice("button[data-theme]", data => { stage.dataset.theme = data.theme; });
    applyChoice("button[data-style]", data => {
      orb.dataset.style = data.style;
      render();
    });
    applyChoice("button[data-size]", data => {
      const size = Number(data.size);
      const space = get("orb-space");
      space.style.setProperty("--zoom", size / 116);
      space.style.width = space.style.height = size + "px";
    });
    document.querySelectorAll("[data-session]").forEach(button => {
      button.addEventListener("click", () => {
        if (button.dataset.session !== "unknown" && button.dataset.session !== currentID) pinnedID = undefined;
        currentID = button.dataset.session;
        closeMenu();
        render();
      });
    });
    rate.addEventListener("input", () => {
      const { primary } = selection();
      primary.rate = rate.valueAsNumber;
      render();
    });
    motionPreference.addEventListener("change", render);
    parallel.addEventListener("click", () => {
      if (menu.hidden) openMenu(parallel);
      else closeMenu(true);
    });
    orb.addEventListener("contextmenu", event => {
      event.preventDefault();
      openMenu(orb);
    });
    orb.addEventListener("keydown", event => {
      if (event.key === "ContextMenu" || (event.shiftKey && event.key === "F10")) {
        event.preventDefault();
        openMenu(orb);
      }
    });
    document.addEventListener("pointerdown", event => {
      if (!orb.contains(event.target) && !menu.contains(event.target)) closeMenu();
    });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && !menu.hidden) closeMenu(true);
    });

    render();
  </script>
</body>
</html>
